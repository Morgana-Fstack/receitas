<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cadastre-se para acompanhar novidades do projeto Receitas da Morg.">
  <title>Novidades | Receitas da Morg</title>
  <link rel="stylesheet" href="cadastro.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">Receitas da Morg</a>
    <nav aria-label="Navegação principal">
      <a href="index.html">Início</a>
      <a href="Receitas.html">Receitas</a>
      <a aria-current="page" href="Cadastro.html">Novidades</a>
    </nav>
  </header>

  <main class="section form-page">
    <div class="section-heading">
      <p class="eyebrow">Fique por dentro</p>
      <h1>Receba novas receitas</h1>
      <p>Esta é uma demonstração de formulário. Nenhum dado é enviado ou armazenado.</p>
    </div>

    <form id="cadastroForm" class="signup-form">
      <div>
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" autocomplete="name" required>
      </div>
      <div>
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div>
        <label for="preferencia">Receita preferida</label>
        <select id="preferencia" name="preferencia">
          <option value="">Selecione uma opção</option>
          <option>Doces</option>
          <option>Salgadas</option>
          <option>Práticas</option>
        </select>
      </div>
      <button class="button" type="submit">Cadastrar demonstração</button>
      <p id="mensagem" class="form-message" role="status" aria-live="polite"></p>
    </form>
  </main>

  <footer>
    <p>Receitas da Morg · Projeto desenvolvido por Morgana Petterle da Cunha</p>
  </footer>

  <script>
    const form = document.getElementById('cadastroForm');
    const message = document.getElementById('mensagem');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const name = document.getElementById('nome').value.trim();
      message.textContent = `Obrigada, ${name}! Demonstração concluída com sucesso.`;
      form.reset();
    });
  </script>
</body>
</html>
